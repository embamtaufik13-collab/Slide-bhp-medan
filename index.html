<!doctype html>
<html lang="id">
<head>

  <title>Slide BHP Medan</title>
  <style>
    :root { --bg: #f5f7fb; --fg: #1a2238; --muted: #5b6475; --accent: #1f5fbf; }

      :root { --bg: #0f1420; --fg: #e8ecf5; --muted: #9aa5bb; --accent: #6fa3ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: .25rem 0; }
    code { background: rgba(127,127,127,.15); padding: .1em .4em; border-radius: 4px; }
    .tag { display: inline-block; margin-bottom: 1rem; padding: .2em .7em; border-radius: 999px;
           background: var(--accent); color: #fff; font-size: .8rem; letter-spacing: .04em; }
  </style>
</head>
